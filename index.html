<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الانتقال إلى المنصة الجديدة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo', 'Tajawal', sans-serif;
        }

        .redirect-wrapper {
            text-align: center;
            padding: 20px;
        }

        .redirect-btn {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.05));
            border: 2px solid #FFD700;
            border-radius: 60px;
            padding: 20px 48px;
            font-family: 'Tajawal', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #FFD700;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.15);
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .redirect-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.3);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.25), rgba(255, 215, 0, 0.1));
        }

        .redirect-btn .arrow {
            font-size: 1.8rem;
            transition: transform 0.3s ease;
        }

        .redirect-btn:hover .arrow {
            transform: translateX(-6px);
        }

        .redirect-btn .badge-new {
            background: #FFD700;
            color: #0a0a0f;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 3px 14px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        @media (max-width: 500px) {
            .redirect-btn {
                padding: 16px 28px;
                font-size: 1.1rem;
                gap: 12px;
            }
            .redirect-btn .arrow {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="redirect-wrapper">
        <a href="https://madrekjo.github.io" target="_blank" rel="noopener noreferrer" class="redirect-btn">
            <span class="arrow">🚀</span>
            الانتقال إلى المنصة الجديدة
            <span class="badge-new">NEW</span>
            <span>↗</span>
        </a>
    </div>
</body>
</html>
